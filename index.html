<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamelMusic Records | JayCamel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="global-audio-player" preload="auto"></audio>

<div class="main-container">
    <div class="brand-header">
       <img src="company.png" class="brand-logo" alt="CamelMusic Logo">
    </div>

    <h1 class="brand-name">CamelMusic Records™</h1>

    <div class="social-icons">
        <a href="https://www.facebook.com/camelmusicrecords" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/camelmusic.records/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-spotify"></i></a>
        <a href="https://soundcloud.com/camelmusicrecords" target="_blank"><i class="fab fa-soundcloud"></i></a>
        <a href="https://www.youtube.com/@camelmusic.records" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="https://www.tiktok.com/@camelmusicrecords" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>

    <div class="nav-container">
        <nav class="nav-scroll-menu">
            <a href="#releases" class="nav-link">Releases</a>
            <a href="#pre-save" class="nav-link">Pre-Save</a>
            <a href="#" class="nav-link">Artists</a>
            <a href="#" class="nav-link">Store</a>
            <a href="#" class="nav-link">Bandcamp</a>
            <a href="#" class="nav-link">Playlist's</a>
        </nav>
    </div>

    <div class="section-header">
        <span class="section-title">Últimos Lanzamientos</span>
        <div class="arrows-container">
            <i class="fas fa-chevron-left" id="prevBtn"></i>
            <i class="fas fa-chevron-right" id="nextBtn"></i>
        </div>
    </div>
    <div class="carousel-container" id="video-carousel">
        <div class="video-card">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/SBhL8Rjxj-8" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="video-card">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/wSgPA8Lope8" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <section class="releases-section" id="releases">
        <div class="section-header">
            <h2 class="section-title">Releases</h2>
            <div class="arrows-container">
                <i class="fas fa-chevron-left" id="prevRel"></i>
                <i class="fas fa-chevron-right" id="nextRel"></i>
            </div>
        </div>
        <div class="releases-grid" id="releasesGrid">
            <div class="release-item">
                <div class="release-thumbnail">
                    <img src="441.jpg" alt="All Nighter">
                    <button class="play-btn-overlay" data-audio="https://p.scdn.co/mp3-preview/38749f168b91954388e390c50058e178593c7270">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
                <div class="release-body">
                    <h3 class="track-title">All Nighter</h3>
                    <p class="artist-name">Omar A.</p>
                    <button class="play-label-btn" data-audio="https://p.scdn.co/mp3-preview/38749f168b91954388e390c50058e178593c7270">
                        <i class="fas fa-play"></i> Play
                    </button>
                </div>
            </div>
            <div class="release-item">
                <div class="release-thumbnail">
                    <img src="https://cdn.komi.io/photos/4fP0cPTQrAKaTXT7gzr6Q.jpg" alt="Farsha">
                    <button class="play-btn-overlay" data-audio="https://p.scdn.co/mp3-preview/4844356066264f3d2f9d8324e4c36190892c9068">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
                <div class="release-body">
                    <h3 class="track-title">Farsha</h3>
                    <p class="artist-name">Stephan Barbieri</p>
                    <button class="play-label-btn" data-audio="https://p.scdn.co/mp3-preview/4844356066264f3d2f9d8324e4c36190892c9068">
                        <i class="fas fa-play"></i> Play
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section class="pre-save-section" id="pre-save">
        <div class="section-header">
            <h2 class="section-title">Pre-Save</h2>
            <div class="arrows-container">
                <i class="fas fa-chevron-left" id="prevPre"></i>
                <i class="fas fa-chevron-right" id="nextPre"></i>
            </div>
        </div>
        <div class="pre-save-grid" id="preSaveGrid">
            <div class="ps-card">
                <img src="https://i.imgur.com/e7Q9C2m.png" class="ps-img" alt="Escape">
                <div class="ps-info">
                    <h3 class="ps-title">Escape</h3>
                    <p class="ps-artist">That's Good</p>
                    <a href="#" class="ps-btn"><i class="fas fa-play"></i> Play</a>
                </div>
            </div>
            <div class="ps-card">
                <img src="https://i.imgur.com/8Nf9y2S.png" class="ps-img" alt="Backroom">
                <div class="ps-info">
                    <h3 class="ps-title">Backroom</h3>
                    <p class="ps-artist">SALVAC</p>
                    <span class="ps-date">Available 15 May 2026</span>
                    <a href="#" class="ps-btn pre-save-type"><i class="fas fa-music"></i> Pre-Save / Pre-Add</a>
                </div>
            </div>
        </div>
    </section>
</div>

<div id="mini-player">
    <div class="player-content">
        <div class="disc-icon"><i class="fas fa-compact-disc fa-spin"></i></div>
        <div class="player-info">
            <span id="player-status">ESCUCHANDO PREVIEW</span>
            <span id="player-text">Selecciona un track</span>
        </div>
    </div>
    <button id="close-player-btn" class="stop-btn">✕</button>
</div>

<script src="script.js"></script>
</body>
</html>
